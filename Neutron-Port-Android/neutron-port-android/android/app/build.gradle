apply plugin: 'com.android.application'

android {
    namespace "com.neutronport.game"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.neutronport.game"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        // Only arm64-v8a is built right now (see /workspace/neutron-port's
        // root CMakeLists.txt ANDROID branch and build-android/); add more
        // ABI builds and drop the matching .so under jniLibs/<abi>/ to
        // widen this.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
    // Prebuilt libneutron.so (compiled separately via the project's own
    // CMake+NDK build, not Gradle's native build integration) lives under
    // src/main/jniLibs/<abi>/ -- Gradle packages anything found there into
    // the APK automatically, no externalNativeBuild step needed.
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
